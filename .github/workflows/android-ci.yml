name: Android CI

on:
  push:
    branches: [ main, "claude/**" ]
  pull_request:
    branches: [ main ]

# Annulla run precedenti sullo stesso ref per risparmiare minuti CI.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  python-ingest-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ingest deps
        run: pip install -r tools/ingest/requirements.txt

      - name: Chunking unit tests
        run: python tools/ingest/test_chunking.py

      # Nota: run_eval.py richiede il modello e5 in tools/models/e5-small (scaricato separatamente).
      # In CI si esegue solo se il modello è disponibile; altrimenti si salta con un avviso.
      - name: Retrieval eval (se il modello e5 è presente)
        run: |
          if [ -f tools/models/e5-small/model_int8.onnx ]; then
            python tools/eval/run_eval.py
          else
            echo "::notice::modello e5 assente in CI — eval del retrieval saltata (vedi tools/ingest/README)."
          fi
